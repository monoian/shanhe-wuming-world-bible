<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山河無名｜官方世界聖經</title>
<meta name="description" content="一個沒有唯一主角、沒有固定主線、世界永不重置的文字型多人武俠世界。">
<meta name="theme-color" content="#0a0d11">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,rgba(189,154,90,.18),transparent 28%),#0a0d11;color:#eee9df;font-family:"Microsoft JhengHei",sans-serif}.box{width:min(640px,calc(100% - 32px));padding:38px;border:1px solid #35404c;border-radius:18px;background:#151b22;text-align:center;box-shadow:0 18px 48px rgba(0,0,0,.32)}h1{font-family:serif;letter-spacing:.1em;margin-top:0}p{color:#aaa394;line-height:1.8}.bar{height:3px;background:#242d37;border-radius:3px;overflow:hidden;margin-top:22px}.bar:after{content:"";display:block;height:100%;width:35%;background:#bd9a5a;animation:load 1.2s infinite alternate}@keyframes load{to{transform:translateX(190%)}}a{color:#e0c993}.small{font-size:13px}
</style>
</head>
<body>
<main class="box">
<h1>山河無名</h1>
<p id="status">正在載入完整世界聖經……</p>
<p class="small" id="progressText">準備網站內容</p>
<div class="bar" id="bar"></div>
<noscript><p>此網站需要啟用 JavaScript 才能載入完整內容。</p></noscript>
</main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const progressText=document.getElementById('progressText');
  const bar=document.getElementById('bar');
  try{
    const files=Array.from({length:11},(_,i)=>`./chunks/part-${String(i).padStart(2,'0')}.txt?v=2`);
    const parts=[];
    for(let i=0;i<files.length;i++){
      progressText.textContent=`載入內容 ${i+1}／${files.length}`;
      const response=await fetch(files[i],{cache:'no-store'});
      if(!response.ok) throw new Error(`chunk-${i}-${response.status}`);
      parts.push(await response.text());
    }
    const source=parts.join('');
    if(!source.includes('<title>山河無名')||!source.includes('id=\'book-8\'')||!source.endsWith('</html>')) throw new Error('invalid-content');
    document.open();
    document.write(source);
    document.close();
  }catch(error){
    status.textContent='網站內容載入失敗';
    progressText.innerHTML='請重新整理頁面。若仍失敗，可前往 <a href="https://github.com/monoian/shanhe-wuming-world-bible">GitHub 專案頁</a> 回報。';
    bar.style.display='none';
    console.error(error);
  }
})();
</script>
</body>
</html>
