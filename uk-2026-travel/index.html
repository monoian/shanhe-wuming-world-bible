<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102A43">
<title>2026 TOYOTA 英國 8天6夜｜載入中</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102a43;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;padding:24px}.box{width:min(560px,100%);padding:38px;border:1px solid rgba(255,255,255,.2);border-radius:22px;background:rgba(255,255,255,.08);text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.25)}.flag{font-size:72px}.bar{height:5px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden;margin:24px 0}.bar:after{content:"";display:block;width:35%;height:100%;background:#e7c96e;animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(185%)}}p{color:#dce8f2;line-height:1.7}.error{display:none}a{color:#ffe39a}.retry{display:inline-block;margin-top:12px;padding:10px 16px;border:1px solid rgba(255,255,255,.35);border-radius:10px;color:#fff;text-decoration:none}
</style>
</head>
<body>
<main class="box">
<div class="flag">🇬🇧</div>
<h1>英國互動旅遊書</h1>
<p id="status">正在載入每日行程與地圖…</p>
<div class="bar" id="bar"></div>
<div class="error" id="error"><p>載入失敗，請按下方按鈕再試一次。</p><a class="retry" href="?reload=1">重新載入</a><br><a class="retry" href="https://drive.google.com/file/d/1Yi8SvNctYausUHoyc8PV2Z3s9gi7Ic9-/view?usp=drivesdk">開啟雲端硬碟版本</a></div>
</main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const names=['payload-0.txt','payload-1.txt','payload-2.txt'];
  const parts=[];
  for(let i=0;i<names.length;i++){
   status.textContent=`正在載入旅遊書資料 ${i+1}/${names.length}…`;
   const r=await fetch(names[i]+'?v=2',{cache:'no-store'});
   if(!r.ok) throw new Error('無法下載 '+names[i]);
   parts.push((await r.text()).replace(/\s+/g,''));
  }
  status.textContent='正在開啟旅遊書…';
  const base64=parts.join('');
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  let html='';
  try{
   if(!('DecompressionStream' in window)) throw new Error('no native gzip');
   const ds=new DecompressionStream('gzip');
   html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  }catch(nativeError){
   await new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
    s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
   });
   html=new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));
  }
  if(!html || !/<html/i.test(html)) throw new Error('旅遊書內容不完整');
  document.open();document.write(html);document.close();
 }catch(e){
  console.error(e);
  status.textContent='網站資料暫時無法載入';
  document.getElementById('bar').style.display='none';
  document.getElementById('error').style.display='block';
 }
})();
</script>
</body>
</html>
